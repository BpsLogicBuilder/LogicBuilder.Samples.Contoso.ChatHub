apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-chat-hub
  namespace: CONTOSO_APP_NAMESPACE
  labels:
    app: contoso-chat-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contoso-chat-hub
  template:
    metadata:
      labels:
        app: contoso-chat-hub
        azure.workload.identity/use: "true" 
    spec:
      automountServiceAccountToken: false
      serviceAccountName: CONTOSO_CHAT_HUB_SERVICEACCOUNT_NAME
      containers:
      - name: contoso-chat-hub
        image: ACR_NAME.azurecr.io/contosochathub:IMAGE_TAG
        ports:
        - containerPort: 8080
        env:
        - name: APPLICATION_CONFIGURATION_ENDPOINT
          value: "APP_CONFIG_ENDPOINT"
        - name: AllowedOrigins__0
          value: "*"
        - name: AZURE_AI_FOUNDRY_PROJECT_ENDPOINT
          value: "FOUNDRY-PROJECT-ENDPOINT"
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "512Mi"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /weatherforecast
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /weatherforecast
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5